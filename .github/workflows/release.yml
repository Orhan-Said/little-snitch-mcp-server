name: Release

# Stages the package on npm when a version tag such as v0.1.1 is pushed.
# npm trusts this workflow through OIDC (trusted publishing): no npm token is
# stored anywhere. npm lets this workflow only stage a version, never publish
# one: a staged version stays hidden until the maintainer approves it with
# two-factor authentication (`npm stage approve <id>`, see docs/releasing.md).
# The workflow asks for a provenance statement that ties the release to the
# commit and the workflow run that built it, and fails without one.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: macos-latest
    timeout-minutes: 30
    # The environment accepts only v* tags, and npm accepts only this workflow in this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in a release, so nothing a cache holds can reach a published package.
          package-manager-cache: false
      - name: Check that the tag matches the package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $expected."
            exit 1
          fi
      - name: Check that this npm can stage a release
        run: |
          if ! npm stage --help >/dev/null 2>&1; then
            echo "::error::npm $(npm --version) has no stage command."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      # Packs the package, unpacks it outside the checkout and starts the server from there,
      # as a plugin client does, before anything is staged.
      - name: Check the packed plugin
        run: npm run check:package
      # npm stage publish runs prepublishOnly (type-check and tests) and prepare (build) first,
      # as npm publish does. A version that is already staged makes it fail, which publishes nothing.
      - name: Stage, unless this version is already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm. Nothing to stage."
            exit 0
          fi
          npm stage publish --provenance
