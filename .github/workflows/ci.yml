name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Little Snitch is a macOS app, and the tests use /bin/sh, osascript-style quoting and codesign.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two LTS lines. The test runner, Vitest 5, needs Node 22.12 or newer.
        node: [22, 24]
    steps:
      # Actions are pinned to a full commit SHA, which the repository's Actions policy requires.
      # Dependabot proposes new SHAs, with the version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=moderate
